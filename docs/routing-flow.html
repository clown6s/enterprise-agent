<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>enterprise-agent 问答路由流程图</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --cat-guard: #2a78d6;   /* 蓝：确定性规则与守卫 */
    --cat-data: #1baf7a;    /* 青：数据查询与已验证知识 */
    --cat-gen: #eb6834;     /* 橙：LLM 生成与执行流程 */
    --warn-badge-ink: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --cat-guard: #3987e5;
      --cat-data: #199e70;
      --cat-gen: #d95926;
      --warn-badge-ink: #f5c96b;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --cat-guard: #3987e5;
    --cat-data: #199e70;
    --cat-gen: #d95926;
    --warn-badge-ink: #f5c96b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); margin: 0 0 16px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-secondary); font-size: 13px;
  }
  .dot { width: 10px; height: 10px; border-radius: 3px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: inherit; }
  .flow-wrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
  }
</style>
</head>
<body class="viz-root">
