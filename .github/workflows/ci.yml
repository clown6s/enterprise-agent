name: CI

# 门控目标：push/PR 到 main 时跑离线测试套件 + 覆盖率下限，红了挡合并。
# 只跑"全离线自包含"的四套（guards/invariants/parse/pipeline = 125 项）——
# 不依赖 Milvus/LLM/MySQL（CI 云端不可用）。需真实外部服务的回归(29)/审批(23)/
# 路由(21) 走本地或夜间，不进 push 门。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # v5 原生 Node 24，消 Node 20 弃用警告

      - uses: actions/setup-python@v5   # setup-python 暂无 Node 24 版（v6 未发布），
        with:
          # 其 Node 20 警告非致命——强制跑 Node 24，照常工作
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: 离线测试套件（任一失败即红）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          coverage erase
          coverage run --source=app --append scripts/test_guards.py
          coverage run --source=app --append scripts/test_invariants.py
          coverage run --source=app --append scripts/test_parse.py
          coverage run --source=app --append scripts/test_pipeline.py
          coverage run --source=app --append scripts/test_startup.py

      - name: 文档签名防漂移检查
        run: python scripts/verify_doc_types.py

      - name: 覆盖率门禁（不低于 24%）
        run: coverage report --fail-under=24

  replay-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 回归 replay（零 LLM/检索成本，确定性回放）
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_eval.py regression --replay --skip-external
