services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: rag_service
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MILVUS_DB: rag_service
      NEO4J_HOST: neo4j
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3); raise SystemExit(0 if r.status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - app_logs:/app/logs
      - app_data:/app/data
    networks: [enterprise_backend]

  nginx:
    container_name: nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /certs:/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [enterprise_backend]

volumes:
  app_logs:
  app_data:

networks:
  enterprise_backend:
    external: true
    name: enterprise_backend
